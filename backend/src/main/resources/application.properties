spring.application.name=eventmanagement

# ===== Database =====
# Handled by DatabaseConfig.java, which supports both:
#  - DATABASE_URL (Render/Supabase combined connection string) - used automatically in production
#  - DB_URL / DB_USERNAME / DB_PASSWORD (separate values) - used for local development
# No database credentials are set directly in this file.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Render assigns a port via the PORT env variable - fall back to 8080 for local dev
server.port=${PORT:8080}

# ===== Email (via Brevo's HTTPS API - Render's free tier blocks raw SMTP ports) =====
# Set these as environment variables:
#   BREVO_API_KEY      - your Brevo "Standard API Key" (starts with xkeysib-)
#   BREVO_SENDER_EMAIL - the verified sender email address in your Brevo account
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}

# The email address that should receive a notification every time someone submits a query.
# Defaults to your Brevo sender email if not set separately.
app.notification.email=${NOTIFICATION_EMAIL:${BREVO_SENDER_EMAIL:}}

# ===== CORS =====
# Comma-separated list of frontend URLs allowed to call this API.
# Add your deployed Angular URL here once you have it, e.g.:
#   http://localhost:4200,https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
