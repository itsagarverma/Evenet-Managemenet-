spring.application.name=eventmanagement

# ===== Database =====
# Handled by DatabaseConfig.java, which supports both:
#  - DATABASE_URL (Render/Supabase combined connection string) - used automatically in production
#  - DB_URL / DB_USERNAME / DB_PASSWORD (separate values) - used for local development
# No database credentials are set directly in this file.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Render assigns a port via the PORT env variable - fall back to 8080 for local dev
server.port=${PORT:8080}

# ===== Email (used to notify you of new queries) =====
# IMPORTANT: generate a NEW Gmail app password (the old one was exposed in this file)
# at https://myaccount.google.com/apppasswords, then set it as an env variable:
#   export MAIL_USERNAME=your-email@gmail.com
#   export MAIL_PASSWORD=your-new-16-char-app-password
# Never paste the real password directly into this file.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== CORS =====
# Comma-separated list of frontend URLs allowed to call this API.
# Add your deployed Angular URL here once you have it, e.g.:
#   http://localhost:4200,https://your-app.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
