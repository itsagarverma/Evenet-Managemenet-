# Production storage must be configured with Supabase. Missing credentials fail startup.
app.gallery.storage.provider=supabase
app.gallery.storage.supabase.endpoint=${SUPABASE_STORAGE_ENDPOINT}
app.gallery.storage.supabase.region=${SUPABASE_STORAGE_REGION}
app.gallery.storage.supabase.accessKey=${SUPABASE_STORAGE_ACCESS_KEY}
app.gallery.storage.supabase.secretKey=${SUPABASE_STORAGE_SECRET_KEY}
app.gallery.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:gallery}
app.gallery.storage.supabase.publicUrl=${SUPABASE_STORAGE_PUBLIC_URL}
