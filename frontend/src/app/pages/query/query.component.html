<app-navbar [simple]="true"></app-navbar>

<div class="form-container">
  <div class="glass-card query-card fade-up visible">
    <h2>Plan Your Dream Event</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="input-group">
          <label>Full Name *</label>
          <input type="text" placeholder="John Doe" formControlName="fullName">
          <div class="form-error" *ngIf="f['fullName'].touched && f['fullName'].invalid">Full name is required.</div>
        </div>

        <div class="input-group">
          <label>Phone Number *</label>
          <input type="tel" placeholder="+91 98765 43210" formControlName="phone">
          <div class="form-error" *ngIf="f['phone'].touched && f['phone'].invalid">Phone number is required.</div>
        </div>

        <div class="input-group full-width">
          <label>Email ID</label>
          <input type="email" placeholder="you@example.com" formControlName="email">
        </div>

        <div class="input-group">
          <label>Event Type</label>
          <select formControlName="eventType">
            <option value="">Select Event Type...</option>
            <option value="wedding">Wedding</option>
            <option value="engagement">Engagement</option>
            <option value="anniversary">Anniversary</option>
            <option value="birthday">Birthday Celebration</option>
            <option value="baby_shower">Baby Shower</option>
            <option value="retirement_party">Retirement Party</option>
            <option value="corporate">Corporate Event</option>
            <option value="haldi_mehendi">Haldi & Mehendi</option>
            <option value="other">Other Celebration</option>
          </select>
        </div>

        <div class="input-group">
          <label>Event Date</label>
          <input type="date" formControlName="eventDate">
        </div>

        <div class="input-group full-width">
          <label>City</label>
          <input type="text" placeholder="Desired city" formControlName="cityVenue">
        </div>

        <div class="input-group full-width">
          <label>Remarks and Messages</label>
          <textarea rows="4" placeholder="Tell us more about your dream event..." formControlName="message"></textarea>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; margin-top: 20px;">
        <a routerLink="/" class="btn btn-outline" style="text-align: center; width: 48%;">Cancel</a>
        <button type="submit" class="btn btn-primary" style="width: 48%;" [disabled]="submitting">
          {{ submitting ? 'Submitting...' : 'Submit Query' }}
        </button>
      </div>

      <p class="form-submit-error" *ngIf="submitError">{{ submitError }}</p>
    </form>
  </div>
</div>

<!-- Success Popup -->
<div class="popup-overlay" [class.active]="showSuccess">
  <div class="popup-content">
    <i class="fas fa-check-circle" style="font-size: 4rem; color: #4CAF50; margin-bottom: 20px;"></i>
    <h3>Thank You!</h3>
    <p style="color: var(--text-light); margin-bottom: 30px;">Your query has been submitted successfully. Our team will contact you shortly to start planning your magical moment.</p>
    <button class="btn btn-primary" (click)="closeSuccess()">Return to Home</button>
  </div>
</div>
